name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every action must be pinned to a commit SHA (scripts/actions-pinned.mjs).
      - run: node --test scripts/actions-pinned.test.mjs
      - run: node scripts/actions-pinned.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built themes are committed for git-dependency consumers; fail if the
      # committed output does not match the theme sources.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm sink:typecheck
